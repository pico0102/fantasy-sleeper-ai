name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: test-mock-key
      SLEEPER_LEAGUE_ID: "1389359956657967104"
      SLEEPER_USER_ID: pinec0ne

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
